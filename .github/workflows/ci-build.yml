name: GitHub CI
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: pygranta
  PACKAGE_NAMESPACE: pygranta
  MAIN_PYTHON_VERSION: '3.12'
  DOCUMENTATION_CNAME: "grantami.docs.pyansys.com"

jobs:

  check-licenses:
    name: Check depencencies' licenses
    runs-on: ubuntu-latest
    steps:
      - name: PyGranta Licenses Check
        uses: ansys/actions/check-licenses@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  docs-style:
    name: Documentation Style Check
    runs-on: ubuntu-latest
    steps:
      - name: PyGranta documentation style checks
        uses: ansys/actions/doc-style@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke-tests-core:
    name: Build core PyGranta packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke test
        run: uv run --frozen python -c "from ${{ env.PACKAGE_NAMESPACE }} import __version__; print(__version__)"

  wheelhouse-all:
    name: Build PyGranta package wheelhouse
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests-core]
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Build wheelhouse and perform smoke test
        uses: ansys/actions/build-wheelhouse@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          operating-system: ${{ runner.os }}
          python-version: ${{ matrix.python-version }}
          attest-provenance: true

      - name: List dependencies (pip freeze)
        run: |
          uv sync --frozen --no-dev --no-install-project
          uv pip freeze > all-deps-${{ runner.os }}-${{ matrix.python-version }}.txt
          cat all-deps-${{ runner.os }}-${{ matrix.python-version }}.txt

      - name: Upload dependencies list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: all-deps-${{ runner.os }}-${{ matrix.python-version }}
          path: all-deps-${{ runner.os }}-${{ matrix.python-version }}.txt
          retention-days: 7

  docs-build:
    name: Building Documentation
    runs-on: ubuntu-latest
    needs: [docs-style]

    steps:
      - name: Build documentation
        uses: ansys/actions/doc-build@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          sphinxopts: "-j auto -W --keep-going -n -t list_packages"
          group-dependencies-name: "doc"
          optional-dependencies-name: ""
        env:
          IS_TAGGED_BUILD: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags') }}

  package:
    name: Package library
    runs-on: ubuntu-latest
    needs: [docs-build, smoke-tests-core]
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Build library source and wheel artifacts
        uses: ansys/actions/build-library@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          attest-provenance: true

  doc-deploy-dev:
    name: "Deploy development docs"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [ package ]
    steps:
      - name: Deploy the latest documentation
        uses: ansys/actions/doc-deploy-dev@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
   name: Release project
   if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
   needs: [package, wheelhouse-all]
   environment: release
   permissions:
     id-token: write
     contents: write
   runs-on: ubuntu-latest
   steps:
     - name: Release to GitHub
       uses: ansys/actions/release-github@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
       with:
         library-name: ${{ env.PACKAGE_NAME }}
         additional-artifacts: 'all-deps-Linux-3.10 all-deps-Linux-3.11 all-deps-Linux-3.12 all-deps-Linux-3.13 all-deps-Windows-3.10 all-deps-Windows-3.11 all-deps-Windows-3.12 all-deps-Windows-3.13'
         token: ${{ secrets.GITHUB_TOKEN }}

     - name: "Download the library artifacts"
       uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
       with:
         name: ${{ env.PACKAGE_NAME }}-artifacts
         path: ${{ env.PACKAGE_NAME }}-artifacts

     - name: "Upload artifacts to PyPI using trusted publisher"
       uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
       with:
         repository-url: "https://upload.pypi.org/legacy/"
         print-hash: true
         packages-dir: ${{ env.PACKAGE_NAME }}-artifacts
         skip-existing: false

  docs-release:
   name: Deploy release docs
   runs-on: ubuntu-latest
   needs: [release]
   steps:
     - name: Deploy the latest release documentation
       uses: ansys/actions/doc-deploy-stable@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
       with:
         cname: ${{ env.DOCUMENTATION_CNAME }}
         token: ${{ secrets.GITHUB_TOKEN }}
         bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
         bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
